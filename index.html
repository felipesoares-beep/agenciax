<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potencial OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0a0d11; --bg-elev:#0d1117;
    --surface:#12171d; --surface-2:#171d24; --surface-3:#1d2530;
    --border:#232c37; --border-soft:#181f28;
    --text:#eef2f5; --text-dim:#94a2ae; --text-faint:#5b6873;
    --accent:#ff7a45; --accent-dim:#e3672f; --accent-soft:rgba(255,122,69,.15); --accent-soft-2:rgba(255,122,69,.08);
    --teal:#2ad9c2; --teal-soft:rgba(42,217,194,.16);
    --violet:#8d90fb; --violet-soft:rgba(141,144,251,.17);
    --amber:#f3b34a; --amber-soft:rgba(243,179,74,.17);
    --red:#f26a61; --red-soft:rgba(242,106,97,.16);
    --green:#3ed599; --green-soft:rgba(62,213,153,.16);
    --faint-soft:rgba(148,162,174,.14);
    --shadow: 0 12px 32px -12px rgba(0,0,0,.55);
    --radius: 12px; --radius-sm:8px;
    font-variant-numeric: tabular-nums;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--accent-soft); color:var(--text); }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px; border:2px solid var(--bg);}
  h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-0.01em;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px; font-size:13.5px; outline:none; transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-dim);}
  input::placeholder,textarea::placeholder{color:var(--text-faint);}
  label{font-size:12px; color:var(--text-dim); font-weight:600; display:block; margin-bottom:6px; letter-spacing:.01em;}
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  /* ---------- shell ---------- */
  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:232px; flex:0 0 232px; background:var(--bg-elev); border-right:1px solid var(--border-soft);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg,var(--accent),#c94e1e); display:flex; align-items:center; justify-content:center; font-family:'Sora'; font-weight:800; font-size:15px; color:#180a04; flex:none; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-family:'Sora'; font-weight:700; font-size:14.5px; letter-spacing:.01em; }
  .brand-text span{ font-size:10.5px; color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint); font-weight:700; padding:0 10px; margin-bottom:2px; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-link{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:var(--radius-sm); color:var(--text-dim); font-weight:600; font-size:13.5px; text-decoration:none; border:none; background:none; width:100%; text-align:left; transition:background .12s,color .12s; }
  .nav-link svg{ flex:none; opacity:.85; }
  .nav-link:hover{ background:var(--surface-2); color:var(--text); }
  .nav-link.active{ background:var(--accent-soft); color:var(--accent); }
  .nav-link.active svg{ opacity:1; }
  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .readonly-banner{ background:var(--amber-soft); color:var(--amber); font-size:11.5px; font-weight:700; padding:8px 10px; border-radius:var(--radius-sm); text-align:center; }
  .user-box{ display:flex; align-items:center; gap:9px; padding:8px; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--border-soft); }
  .user-box .meta{ line-height:1.2; overflow:hidden; }
  .user-box .meta b{ font-size:12.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-box .meta span{ font-size:11px; color:var(--text-faint); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ height:72px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 28px; border-bottom:1px solid var(--border-soft); gap:16px; }
  .topbar-title{ display:flex; align-items:center; gap:11px; min-width:0; }
  .topbar-title .icon-badge{ width:34px; height:34px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex:none; }
  .topbar-title h1{ font-size:17px; }
  .topbar-title p{ margin:0; font-size:11.5px; color:var(--text-faint); font-weight:600; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; flex:none; }
  .content{ flex:1; padding:26px 28px 60px; overflow-x:hidden; }

  /* ---------- buttons ---------- */
  .btn{ display:inline-flex; align-items:center; gap:7px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:700; font-size:13px; padding:9px 14px; transition:background .12s,border-color .12s,transform .08s; white-space:nowrap; }
  .btn:hover{ background:var(--surface-3); }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#1c0c04; }
  .btn-primary:hover{ background:#ff8b5c; }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-dim); }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--text); }
  .btn-danger{ background:var(--red-soft); border-color:transparent; color:var(--red); }
  .btn-danger:hover{ background:rgba(242,106,97,.28); }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn-icon{ padding:8px; }
  .btn[disabled]{ opacity:.45; pointer-events:none; }

  /* ---------- generic ---------- */
  .card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); }
  .grid{ display:grid; gap:16px; }
  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:20px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:8px; }
  .stat-card .stat-top{ display:flex; align-items:center; gap:8px; color:var(--text-dim); font-size:12px; font-weight:700; }
  .stat-card .stat-top svg{ opacity:.75; }
  .stat-card .stat-value{ font-family:'Sora'; font-size:26px; font-weight:700; display:flex; align-items:baseline; gap:8px; }
  .stat-card .stat-sub{ font-size:11.5px; font-weight:700; color:var(--text-faint); }
  .stat-sub.warn{ color:var(--red); }
  .stat-sub.ok{ color:var(--green); }
  .stat-sub.info{ color:var(--amber); }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3.5px 9px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.01em; white-space:nowrap; }
  .pill::before{ content:''; width:6px; height:6px; border-radius:99px; background:currentColor; flex:none; }
  .pill-neutral{ background:var(--faint-soft); color:var(--text-dim); }
  .pill-accent{ background:var(--accent-soft); color:var(--accent); }
  .pill-amber{ background:var(--amber-soft); color:var(--amber); }
  .pill-violet{ background:var(--violet-soft); color:var(--violet); }
  .pill-red{ background:var(--red-soft); color:var(--red); }
  .pill-green{ background:var(--green-soft); color:var(--green); }
  .pill-teal{ background:var(--teal-soft); color:var(--teal); }

  .dot{ width:7px; height:7px; border-radius:99px; flex:none; display:inline-block; }
  .dot-neutral{background:var(--text-faint);} .dot-accent{background:var(--accent);} .dot-amber{background:var(--amber);}
  .dot-violet{background:var(--violet);} .dot-red{background:var(--red);} .dot-green{background:var(--green);} .dot-teal{background:var(--teal);}

  .avatar{ width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Sora'; font-weight:700; font-size:11px; color:#0c0c0c; flex:none; }
  .avatar.lg{ width:40px; height:40px; border-radius:10px; font-size:14px; }
  .avatar-stack{ display:flex; }
  .avatar-stack .avatar{ margin-left:-8px; border:2px solid var(--surface); }
  .avatar-stack .avatar:first-child{ margin-left:0; }

  .search-wrap{ position:relative; display:flex; align-items:center; }
  .search-wrap svg{ position:absolute; left:11px; opacity:.5; pointer-events:none; }
  .search-wrap input{ padding-left:32px; width:220px; }

  .tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--border-soft); border-radius:10px; padding:3px; width:fit-content; }
  .tab-btn{ border:none; background:none; color:var(--text-dim); font-weight:700; font-size:12.5px; padding:7px 13px; border-radius:8px; }
  .tab-btn.active{ background:var(--surface-3); color:var(--text); }
  .filter-chip{ border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-weight:700; font-size:12px; padding:6px 12px; border-radius:99px; display:inline-flex; align-items:center; gap:6px; }
  .filter-chip.active{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .filter-chip b{ font-family:'IBM Plex Mono'; font-weight:600; }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; padding:0 14px 10px; border-bottom:1px solid var(--border-soft); }
  tbody td{ padding:12px 14px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.row-hover:hover{ background:var(--surface-2); }
  .table-scroll{ overflow-x:auto; }
  .num{ font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; }

  .progress{ width:100%; height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .progress > span{ display:block; height:100%; background:linear-gradient(90deg,var(--teal),var(--green)); border-radius:99px; }

  .empty-state{ text-align:center; padding:48px 20px; color:var(--text-faint); }
  .empty-state svg{ opacity:.4; margin-bottom:10px; }
  .empty-state p{ margin:0; font-size:13px; font-weight:600; }

  /* ---------- modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(4,6,8,.6); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; animation:fadeIn .15s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:480px; max-height:88vh; overflow:auto; box-shadow:var(--shadow); }
  .modal.wide{ max-width:640px; }
  .modal.xwide{ max-width:1040px; }
  .modal.xwide.no-preview{ max-width:640px; }
  .contract-modal-body{ display:flex; align-items:stretch; min-height:0; }
  .contract-form-col{ flex:1 1 55%; min-width:0; padding:20px; display:flex; flex-direction:column; gap:14px; max-height:74vh; overflow-y:auto; }
  .contract-preview-col{ flex:1 1 45%; min-width:0; background:var(--bg-elev); border-left:1px solid var(--border-soft); max-height:74vh; overflow-y:auto; padding:22px 24px; }
  .modal.no-preview .contract-preview-col{ display:none; }
  .contract-preview-doc{ white-space:pre-wrap; font-size:12px; line-height:1.7; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
  .contract-preview-doc b, .contract-preview-doc strong{ color:var(--text); }
  .section-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:700; margin:4px 0 -2px; padding-top:10px; border-top:1px solid var(--border-soft); }
  .section-label:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .parcela-row{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:9px; padding:8px 10px; }
  .parcela-row .parcela-idx{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-faint); font-weight:700; flex:none; width:20px; }
  .parcela-row .parcela-val{ font-family:'IBM Plex Mono'; font-weight:700; font-size:12.5px; color:var(--teal); flex:none; min-width:82px; }
  .parcela-row input{ flex:1; padding:6px 9px; font-size:12px; }
  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{ width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:800; }
  .stepper button:hover{ background:var(--surface-3); }
  .stepper span{ font-family:'IBM Plex Mono'; font-weight:700; min-width:16px; text-align:center; }

  /* ---------- financeiro fechamento ---------- */
  .mini-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px; font-weight:700; }
  .mini-row:last-child{ border-bottom:none; }
  .mini-row .mini-label{ display:flex; align-items:center; gap:8px; color:var(--text-dim); }
  .donut-wrap{ position:relative; width:126px; height:126px; margin:6px auto 2px; }
  .donut-wrap svg{ transform:rotate(-90deg); }
  .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-center b{ font-family:'Sora'; font-size:19px; }
  .donut-center span{ font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .warn-banner{ background:var(--amber-soft); color:var(--amber); padding:10px 14px; border-radius:10px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:18px; }
  .cat-details{ border-bottom:1px solid var(--border-soft); padding:10px 0; }
  .cat-details:last-child{ border-bottom:none; }
  .cat-details summary{ cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; }
  .cat-details summary::-webkit-details-marker{ display:none; }
  .cat-details summary .cat-name{ display:flex; align-items:center; gap:7px; color:var(--text); }
  .cat-details summary .cat-name .chev{ transition:transform .15s; color:var(--text-faint); }
  .cat-details[open] summary .cat-name .chev{ transform:rotate(90deg); }
  .cat-details .cat-sub{ font-size:10.5px; color:var(--text-faint); font-weight:600; margin-left:6px; }
  .cat-item-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0 7px 20px; font-size:12px; color:var(--text-dim); font-weight:600; }
  .fixed-row{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border-soft); }
  .fixed-row:last-child{ border-bottom:none; }
  .fixed-check{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border); flex:none; display:flex; align-items:center; justify-content:center; background:var(--surface-2); }
  .fixed-check.on{ background:var(--green); border-color:var(--green); color:#06251a; }
  .fixed-name{ flex:1; font-size:12.5px; font-weight:700; }
  .fixed-meta{ font-size:10.5px; color:var(--text-faint); font-weight:600; }
  .notas-chip{ background:var(--amber-soft); color:var(--amber); font-size:11px; font-weight:700; padding:4px 9px; border-radius:7px; border:none; }
  .notas-chip:hover{ background:rgba(243,179,74,.28); }

  /* ---------- propostas ---------- */
  .proposta-card{ display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--border-soft); }
  .proposta-card:last-child{ border-bottom:none; }
  .proposta-modal-body{ display:flex; align-items:stretch; min-height:0; }
  .proposta-form-col{ flex:1 1 34%; min-width:0; padding:20px; display:flex; flex-direction:column; gap:14px; max-height:78vh; overflow-y:auto; }
  .proposta-preview-col{ flex:1 1 66%; min-width:0; background:#050708; border-left:1px solid var(--border-soft); max-height:78vh; overflow-y:auto; padding:0; }
  .modal.proposta-no-preview .proposta-preview-col{ display:none; }
  .modal.proposta-no-preview{ max-width:640px; }

  .prop-doc{ background:#0c0f13; color:#e7ebee; font-family:'Manrope',sans-serif; padding:44px 40px 36px; }
  .prop-doc .prop-brand{ display:flex; align-items:center; gap:9px; margin-bottom:26px; }
  .prop-doc .prop-brand .mark{ width:28px; height:28px; border-radius:7px; background:linear-gradient(155deg,var(--accent),#c94e1e); flex:none; }
  .prop-doc .prop-brand b{ font-family:'Sora'; font-weight:800; font-size:13px; letter-spacing:.02em; }
  .prop-doc .prop-brand span{ color:var(--accent); font-weight:800; }
  .prop-hero{ display:grid; grid-template-columns:1.3fr 1fr; gap:36px; padding-bottom:28px; border-bottom:1px solid #1c2128; }
  .prop-hero h1{ font-family:'Sora'; font-size:44px; font-weight:800; letter-spacing:-.01em; margin:0 0 14px; text-transform:uppercase; }
  .prop-hero h1 .dot{ color:var(--accent); }
  .prop-hero p{ font-size:13px; line-height:1.7; color:#aab3bb; margin:0 0 12px; }
  .prop-hero p b{ color:#fff; }
  .prop-phases{ display:flex; flex-direction:column; gap:16px; }
  .prop-phase b{ display:block; font-family:'Sora'; font-size:14px; font-weight:700; margin-bottom:5px; }
  .prop-phase p{ font-size:11.5px; line-height:1.6; color:#9aa3ab; margin:0; }
  .prop-for{ display:flex; align-items:baseline; gap:12px; padding:22px 0; border-bottom:1px solid #1c2128; }
  .prop-for span.lbl{ font-size:10.5px; color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
  .prop-for b{ font-family:'Sora'; font-size:26px; font-weight:800; }
  .prop-section-label{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); padding:18px 0 14px; }
  .prop-section-label span{ color:#6b747c; font-weight:700; margin-left:8px; }
  .prop-grid{ display:grid; grid-template-columns:1fr 1fr; gap:30px; padding-bottom:22px; border-bottom:1px solid #1c2128; }
  .prop-grid h4{ font-family:'Sora'; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:#7c858c; margin-bottom:10px; }
  .prop-grid .big{ font-family:'Sora'; font-size:15px; font-weight:800; margin-bottom:8px; }
  .prop-team-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .prop-team-list li{ font-size:12.5px; color:#c9d0d5; padding-left:14px; position:relative; }
  .prop-team-list li::before{ content:''; width:5px; height:5px; border-radius:99px; background:var(--accent); position:absolute; left:0; top:7px; }
  .prop-grid p{ font-size:12px; line-height:1.65; color:#9aa3ab; margin:0; }
  .prop-service-row{ display:flex; align-items:flex-start; gap:18px; padding:18px 0; border-bottom:1px solid #1c2128; }
  .prop-service-row .stag{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); flex:0 0 130px; padding-top:2px; }
  .prop-service-row b{ display:block; font-family:'Sora'; font-size:14px; font-weight:800; margin-bottom:5px; text-transform:uppercase; }
  .prop-service-row p{ font-size:12px; line-height:1.6; color:#9aa3ab; margin:0; flex:1; }
  .prop-service-row .perf-pill{ flex:none; background:var(--accent); color:#1c0c04; font-weight:800; font-size:10.5px; padding:5px 11px; border-radius:99px; white-space:nowrap; }
  .prop-invest{ padding:18px 0; font-size:12px; line-height:1.7; color:#9aa3ab; border-bottom:1px solid #1c2128; }
  .prop-footer{ display:flex; align-items:flex-end; justify-content:space-between; padding-top:22px; gap:20px; flex-wrap:wrap; }
  .prop-footer .valid{ font-size:10.5px; color:#7c858c; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .prop-footer .valid b{ color:#c9d0d5; }
  .prop-total{ text-align:right; }
  .prop-total .lbl{ display:block; font-size:10.5px; color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .prop-total .nums{ font-family:'Sora'; font-size:30px; font-weight:800; }

function numberToWordsPT(n){
  n = Math.round(Math.abs(n||0));
  if(n===0) return 'zero';
  const UNI=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const DEZ=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const CEM=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  function three(v){
    if(v===0) return '';
    if(v===100) return 'cem';
    const c=Math.floor(v/100), r=v%100;
    const parts=[];
    if(c>0) parts.push(CEM[c]);
    if(r>0){
      if(r<20) parts.push(UNI[r]);
      else { const d=Math.floor(r/10), u=r%10; parts.push(u>0 ? DEZ[d]+' e '+UNI[u] : DEZ[d]); }
    }
    return parts.join(' e ');
  }
  const groups=[]; let t=n;
  while(t>0){ groups.unshift(t%1000); t=Math.floor(t/1000); }
  const words=[];
  const gLen=groups.length;
  groups.forEach(function(val,i){
    if(val===0) return;
    const power = gLen-1-i;
    let w = three(val);
    if(power===1) w = (val===1 ? 'mil' : w+' mil');
    else if(power===2) w += (val===1 ? ' milhão' : ' milhões');
    words.push(w);
  });
  return words.join(' e ');
}
function computeParcelas(d){
  const valorTotal = Number(d.valorTotal)||0;
  const numParcelas = Math.max(1, Number(d.numParcelas)||1);
  const base = Math.floor((valorTotal/numParcelas)*100)/100;
  const arr = [];
  let acumulado = 0;
  for(let i=0;i<numParcelas;i++){
    const isLast = i===numParcelas-1;
    const valor = isLast ? Math.round((valorTotal-acumulado)*100)/100 : base;
    acumulado += valor;
    arr.push({ valor: valor, descricao: (d.parcelaDescricoes && d.parcelaDescricoes[i]) || (i===0?'no início dos serviços':'na conclusão da entrega') });
  }
  return arr;
}

/* ---------------- persistence ---------------- */
let artifactApi = null;
let readOnlyMode = false;

function serializeState(){
  return JSON.stringify(STATE).replace(/<\/script/gi, '<' + '\\/script');
}
function renderDocument(){
  const safeJson = serializeState();
  const patchedBody = BODY_SNAPSHOT.replace(/\/\*@STATE_START\*\/[\s\S]*?\/\*@STATE_END\*\//, '/*@STATE_START*/' + safeJson + '/*@STATE_END*/');
  return '<!doctype html>\n<html lang="pt-BR">\n<head>\n' + HEAD_SNAPSHOT + '\n</head>\n<body>\n' + patchedBody + '\n</body>\n</html>';
}

async function persist(){
  try{
    if(!window.claude){ localStorage.setItem('potencial-os-state', serializeState()); return; }
    if(!artifactApi){ artifactApi = await window.claude.use('artifact'); }
    if(!artifactApi){ localStorage.setItem('potencial-os-state', serializeState()); return; }
    await artifactApi.publish(renderDocument());
  }catch(err){
    if(err && (err.code==='not_writer' || err.code==='not_granted')){
      enterReadOnly();
    } else if(err && err.code==='conflict'){
      /* shell is already reloading every open view to the winner */
    } else {
      localStorage.setItem('potencial-os-state', serializeState());
      toast('Não sincronizou com a equipe agora — salvo só neste navegador.');
    }
  }
}
function enterReadOnly(){
  readOnlyMode = true;
  render();
}

/* ---------------- auth gate ---------------- */
async function sha256Hex(text){
  if(window.crypto && window.crypto.subtle){
    const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }
  return 'legacy:'+hashStr(text);
}
function isUnlocked(){
  try{ return localStorage.getItem('potencial-os-auth')==='unlocked'; }catch(e){ return false; }
}

}

  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i===0?0:i-1];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2<pts.length?i+2:pts.length-1];
    const cp1x = p1.x + (p2.x-p0.x)/6, cp1y = p1.y + (p2.y-p0.y)/6;
    const cp2x = p2.x - (p3.x-p1.x)/6, cp2y = p2.y - (p3.y-p1.y)/6;
    d += 'C '+cp1x.toFixed(1)+','+cp1y.toFixed(1)+' '+cp2x.toFixed(1)+','+cp2y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1)+' ';
  }
  return d;
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Link copiado!')).catch(()=>toast('Não foi possível copiar — copie manualmente.'));
  } else { toast('Copie manualmente: '+text); }
}

function renderDemandaOverview(tasksIn){
  const tasks = tasksIn.filter(t=>t.status!=='entregue');
  const overdue = tasks.filter(t=>t.data<TODAY).sort((a,b)=>a.data<b.data?-1:1);
  const within = tasks.filter(t=>t.data>=TODAY && daysBetween(TODAY,t.data)<=ui.demandaRange).sort((a,b)=>a.data<b.data?-1:1);
  const beyond = tasks.filter(t=>t.data>=TODAY && daysBetween(TODAY,t.data)>ui.demandaRange);
  const byDate = {};
  within.forEach(t=>{ (byDate[t.data]=byDate[t.data]||[]).push(t); });

  let html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">'+
    '<div style="font-size:12.5px;font-weight:700;color:var(--text-dim)">Próximos '+ui.demandaRange+' dias <span style="color:var(--text-faint);font-weight:600">· '+within.length+' tarefas'+(overdue.length?' · '+overdue.length+' atrasadas':'')+'</span></div>'+
    '<div class="tabs">'+[7,14,30].map(r=>'<button class="tab-btn'+(ui.demandaRange===r?' active':'')+'" data-action="demanda-range" data-range="'+r+'">'+r+' dias</button>').join('')+'</div>'+
  '</div>';

  if(overdue.length){
    html += '<div class="day-group"><div class="day-group-head overdue">'+svgIcon('clock')+' Atrasadas <span class="num">'+overdue.length+'</span></div>'+taskTableRows(overdue)+'</div>';
  }
  const dateKeys = Object.keys(byDate).sort();
  dateKeys.forEach(d=>{
    html += '<div class="day-group"><div class="day-group-head">'+fmtDateLong(d)+' <span class="num">'+byDate[d].length+'</span></div>'+taskTableRows(byDate[d])+'</div>';
  });
  if(!overdue.length && !dateKeys.length){
    html += '<div class="empty-state">'+svgIcon('check')+'<p>Nada por aqui nesse período.</p></div>';
  }
  if(beyond.length){
    html += '<p style="font-size:12px;color:var(--text-faint);font-weight:600;margin-top:6px">Mais '+beyond.length+' tarefa(s) com vencimento além de '+ui.demandaRange+' dias.</p>';
  }
  return html;
}

  const startDow = first.getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const prevDays = new Date(y,m-1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push({d:prevDays-startDow+1+i, other:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, other:false, key: y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')});
  let trailDay = 1;
  while(cells.length%7!==0){ cells.push({d:trailDay, other:true}); trailDay++; }
  const byDate = {};
  tasks.forEach(t=>{ (byDate[t.data]=byDate[t.data]||[]).push(t); });

  return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
    '<div style="display:flex;align-items:center;gap:10px">'+
      '<button class="btn btn-ghost btn-icon btn-sm" data-action="demanda-cal-nav" data-dir="-1" style="transform:scaleX(-1)">'+svgIcon('chevron')+'</button>'+
      '<h3 style="font-size:15px;min-width:160px;text-align:center">'+MONTHS_PT[m-1]+' de '+y+'</h3>'+
      '<button class="btn btn-ghost btn-icon btn-sm" data-action="demanda-cal-nav" data-dir="1">'+svgIcon('chevron')+'</button>'+
    '</div></div>'+
    '<div class="cal-grid">'+DOW_PT.map(d=>'<div class="cal-dow">'+d+'</div>').join('')+
    cells.map(c=>{
      if(c.other) return '<div class="cal-cell other-month"><span class="cal-date">'+c.d+'</span></div>';
      const items = (byDate[c.key]||[]);
      return '<div class="cal-cell'+(c.key===TODAY?' today':'')+'"><span class="cal-date">'+c.d+'</span>'+
        items.slice(0,3).map(t=>{
          const st = TASK_STATUS[t.status];
          return '<div class="cal-task" style="background:'+toneBg(st.c)+';color:'+toneFg(st.c)+'" data-action="edit-task" data-id="'+t.id+'">'+esc(t.titulo)+'</div>';
        }).join('')+
        (items.length>3?'<span style="font-size:10px;color:var(--text-faint);font-weight:700">+'+(items.length-3)+' mais</span>':'')+
      '</div>';
    }).join('')+
    '</div>';
}

function shiftFinanceMonth(dir){
  const [y,m]=ui.financeMonth.split('-').map(Number);
  const d=new Date(y,m-1+dir,1);
  ui.financeMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const CATEGORIA_DESC = {
  'Clientes fixos':'contratos recorrentes', 'Landing Page e Sites':'criação de páginas e sites',
  'Pagamentos parcelados':'cobranças divididas em parcelas', 'Infoprodutos':'lançamentos e produtos digitais',
  'Projeto pontual':'trabalhos avulsos'
};
function monthsBack(monthStr, n){
  const parts = monthStr.split('-').map(Number);
  const arr=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(parts[0], parts[1]-1-i, 1); arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return arr;
}
function saldoAteMonth(monthStr){
  let total = STATE.meta.saldoBase;
  STATE.finance.forEach(function(f){ if(f.data.slice(0,7)<=monthStr) total += (f.tipo==='entrada'?f.valor:-f.valor); });
  return total;
}
function renderFinanceiro(root){
  const monthItems = STATE.finance.filter(f=>f.data.slice(0,7)===ui.financeMonth);
  const entradas = monthItems.filter(f=>f.tipo==='entrada');
  const saidasFixasItems = monthItems.filter(f=>f.tipo==='saida' && f.categoria==='Saídas fixas');
  const saidasVariaveis = monthItems.filter(f=>f.tipo==='saida' && f.categoria!=='Saídas fixas');
  const totalEntradas = entradas.reduce((a,b)=>a+b.valor,0);
  const totalSaidas = saidasFixasItems.reduce((a,b)=>a+b.valor,0) + saidasVariaveis.reduce((a,b)=>a+b.valor,0);
  const lucro = totalEntradas-totalSaidas;
  const pendentes = monthItems.filter(f=>f.status==='pendente');
  const [y,m] = ui.financeMonth.split('-').map(Number);

  const metaMensal = STATE.meta.metaMensal||1;
  const metaPct = Math.min(100, Math.round(totalEntradas/metaMensal*100));
  const faltamMeta = Math.max(0, metaMensal-totalEntradas);
  const saldoEmCaixa = saldoAteMonth(ui.financeMonth);

  const recurringRows = STATE.recurringExpenses.map(function(re){
    const match = STATE.finance.find(function(f){ return f.recurringId===re.id && f.data.slice(0,7)===ui.financeMonth; });
    return { re:re, match:match, paid: !!match, needsDefine: !match && re.valorPadrao==null };
  });
  const undefinedCount = recurringRows.filter(function(r){ return r.needsDefine; }).length;
  const saidasFixasTotal = recurringRows.reduce(function(a,r){ return a + (r.paid? r.match.valor : (r.re.valorPadrao||0)); },0);

  const catGroups = {};
  entradas.forEach(function(f){ (catGroups[f.categoria]=catGroups[f.categoria]||[]).push(f); });
  const catKeys = Object.keys(catGroups).sort(function(a,b){ return catGroups[b].reduce((s,i)=>s+i.valor,0)-catGroups[a].reduce((s,i)=>s+i.valor,0); });

  const notasPendentes = entradas.filter(function(f){ return !f.notaEmitida; });

  const months6 = monthsBack(ui.financeMonth,6);
  const flow = months6.map(function(mo){
    const items = STATE.finance.filter(function(f){ return f.data.slice(0,7)===mo; });
    return { mo:mo, ent: items.filter(f=>f.tipo==='entrada').reduce((a,b)=>a+b.valor,0), sai: items.filter(f=>f.tipo==='saida').reduce((a,b)=>a+b.valor,0) };
  });
  const flowMax = Math.max.apply(null, flow.map(f=>Math.max(f.ent,f.sai)).concat([1000]));
  const fW=560,fH=170,fPadL=44,fPadB=22,fPadT=10;
  const fStepX=(fW-fPadL-8)/(flow.length-1);
  const entPts = flow.map(function(f,i){ return {x:fPadL+fStepX*i, y:fPadT+(1-f.ent/flowMax)*(fH-fPadT-fPadB)}; });
  const saiPts = flow.map(function(f,i){ return {x:fPadL+fStepX*i, y:fPadT+(1-f.sai/flowMax)*(fH-fPadT-fPadB)}; });
  const entArea = smoothPath(entPts)+' L '+entPts[entPts.length-1].x.toFixed(1)+','+(fH-fPadB)+' L '+entPts[0].x.toFixed(1)+','+(fH-fPadB)+' Z';
  const flowGrid = [0,0.5,1].map(function(f){ const yy=fPadT+f*(fH-fPadT-fPadB); return '<line x1="'+fPadL+'" y1="'+yy+'" x2="'+(fW-4)+'" y2="'+yy+'" stroke="var(--border-soft)" stroke-width="1"/><text x="2" y="'+(yy+4)+'" font-size="9.5" fill="var(--text-faint)" font-family=\'IBM Plex Mono\'>'+fmtMoneyShort(Math.round(flowMax*(1-f)))+'</text>'; }).join('');
  const flowLabels = flow.map(function(f,i){ const [fy,fm]=f.mo.split('-'); return '<text x="'+entPts[i].x.toFixed(1)+'" y="'+(fH-4)+'" font-size="10" fill="var(--text-faint)" font-family="Manrope" font-weight="700" text-anchor="middle">'+MONTHS_PT[Number(fm)-1]+'</text>'; }).join('');

  const donutR=52, donutC=2*Math.PI*donutR, donutOff=donutC*(1-metaPct/100);

  root.innerHTML = ''+
  '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">'+
    '<div style="display:flex;align-items:center;gap:8px">'+
      '<button class="btn btn-ghost btn-icon btn-sm" data-action="finance-month-nav" data-dir="-1" style="transform:scaleX(-1)">'+svgIcon('chevron')+'</button>'+
      '<div><div style="font-weight:800;font-family:\'Sora\';font-size:14.5px">Fechamento do mês</div><div style="font-size:11px;color:var(--text-faint);font-weight:700">'+MONTHS_PT[m-1]+' de '+y+'</div></div>'+
      '<button class="btn btn-ghost btn-icon btn-sm" data-action="finance-month-nav" data-dir="1">'+svgIcon('chevron')+'</button>'+
    '</div>'+
    '<button class="btn btn-ghost btn-sm" data-action="edit-meta-financeiro">'+svgIcon('edit')+' Meta e saldo base</button>'+
  '</div>'+
  (undefinedCount>0 ? '<div class="warn-banner">'+svgIcon('clock')+' '+undefinedCount+' lançamento(s) fixo(s) ainda sem valor este mês — clique em "definir" na lista de saídas fixas.</div>' : '')+
  '<div class="stat-row">'+
    '<div class="stat-card">'+
      '<div class="stat-top">'+svgIcon('trend')+' Lucro do mês</div>'+
      '<div class="stat-value" style="color:'+(lucro>=0?'var(--green)':'var(--red)')+'">'+fmtMoney(lucro)+'</div>'+
      '<div class="progress" style="margin-top:2px"><span style="width:'+metaPct+'%"></span></div>'+
      '<div class="stat-sub '+(faltamMeta>0?'info':'ok')+'">'+(faltamMeta>0?'faltam '+fmtMoney(faltamMeta)+' pra meta':'meta batida!')+' · '+metaPct+'%</div>'+
    '</div>'+
    '<div class="stat-card">'+
      '<div class="stat-top">'+svgIcon('financeiro')+' Movimento do mês</div>'+
      '<div class="mini-row"><span class="mini-label" style="color:var(--green)">'+svgIcon('trend')+' Recebido</span><span class="num">'+fmtMoney(totalEntradas)+'</span></div>'+
      '<div class="mini-row"><span class="mini-label" style="color:var(--red)">'+svgIcon('clock')+' Despesas</span><span class="num">'+fmtMoney(totalSaidas)+'</span></div>'+
    '</div>'+
    '<div class="stat-card">'+
      '<div class="stat-top">'+svgIcon('check')+' Saldo em caixa</div>'+
      '<div class="stat-value">'+fmtMoney(saldoEmCaixa)+'</div>'+
      '<div class="stat-sub">base '+fmtMoney(STATE.meta.saldoBase)+' · ajustado pelo que entra e sai</div>'+
    '</div>'+
  '</div>'+
  '<div class="grid" style="grid-template-columns:1.7fr 1fr;align-items:stretch;margin-bottom:16px">'+

      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><h3 style="font-size:14px">Fluxo de caixa</h3><div class="chart-legend"><span><i class="lg-dot" style="background:var(--green)"></i>Entradas</span><span><i class="lg-dot" style="background:var(--red)"></i>Saídas</span></div></div>'+
      '<svg viewBox="0 0 '+fW+' '+fH+'" style="width:100%;height:190px" preserveAspectRatio="none">'+
        '<defs><linearGradient id="flowGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity="0.3"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>'+
        flowGrid+
        '<path d="'+entArea+'" fill="url(#flowGrad)"/>'+
        '<path d="'+smoothPath(entPts)+'" fill="none" stroke="var(--green)" stroke-width="2.3" stroke-linecap="round"/>'+
        '<path d="'+smoothPath(saiPts)+'" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>'+
        flowLabels+
      '</svg>'+
    '</div>'+
    '<div class="card" style="padding:18px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
      '<h3 style="font-size:14px;align-self:flex-start;margin-bottom:2px">Meta do mês</h3>'+
      '<div class="donut-wrap"><svg width="126" height="126" viewBox="0 0 126 126">'+
        '<circle cx="63" cy="63" r="'+donutR+'" fill="none" stroke="var(--surface-3)" stroke-width="12"/>'+
        '<circle cx="63" cy="63" r="'+donutR+'" fill="none" stroke="var(--teal)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+donutC.toFixed(1)+'" stroke-dashoffset="'+donutOff.toFixed(1)+'"/>'+
      '</svg><div class="donut-center"><b>'+metaPct+'%</b><span>da meta</span></div></div>'+
      '<div style="width:100%;margin-top:10px;font-size:11.5px;font-weight:700;color:var(--text-faint);display:flex;flex-direction:column;gap:4px">'+
        '<div style="display:flex;justify-content:space-between"><span>Recebido</span><span class="num" style="color:var(--text)">'+fmtMoney(totalEntradas)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between"><span>Meta</span><span class="num" style="color:var(--text)">'+fmtMoney(metaMensal)+'</span></div>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="card" style="padding:18px 20px;margin-bottom:16px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><h3 style="font-size:14px">Notas fiscais</h3><span class="tag-chip">'+notasPendentes.length+' a emitir</span></div>'+
    (notasPendentes.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">'+notasPendentes.map(function(f){ const cl=f.clientId?clientById(f.clientId):null; return '<button class="notas-chip" data-action="toggle-nota-emitida" data-id="'+f.id+'" title="Clique para marcar como emitida">'+esc(cl?cl.nome:f.descricao)+'</button>'; }).join('')+'</div>' : '<p style="font-size:12px;color:var(--text-faint);font-weight:600;margin:8px 0 0">Todas as notas deste mês já foram emitidas.</p>')+

          items.map(function(f){ const cl=f.clientId?clientById(f.clientId):null; return '<div class="cat-item-row" data-action="open-finance-modal" data-id="'+f.id+'" style="cursor:pointer"><span>'+esc(cl?cl.nome:f.descricao)+'</span><span class="num">'+fmtMoney(f.valor)+'</span></div>'; }).join('')+
        '</details>';
      }).join('') : '<p style="font-size:12px;color:var(--text-faint);font-weight:600">Sem entradas neste mês.</p>')+

            (r.needsDefine ? '<button class="btn btn-ghost btn-sm" data-action="recurring-define" data-id="'+r.re.id+'">definir</button>' :
              '<button class="btn btn-ghost btn-sm" data-action="recurring-mark-paid" data-id="'+r.re.id+'">'+valorTxt+'</button>'))+

      }).join('')+

        saidasVariaveis.map(function(f){ const cl=f.clientId?clientById(f.clientId):null; return '<div class="cat-item-row" data-action="open-finance-modal" data-id="'+f.id+'" style="cursor:pointer;padding-left:2px"><span>'+esc(f.descricao)+(cl?' · '+esc(cl.nome):'')+'</span><span class="num">'+fmtMoney(f.valor)+'</span></div>'; }).join('')+
      '</div>' : '')+
    '</div>'+
  '</div>'+
  '<div class="card table-scroll">'+
    '<div style="padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">'+
      '<div class="tabs">'+[['todos','Todos'],['entradas','Entradas'],['saidas','Saídas'],['pendentes','Pendentes']].map(function(p){ return '<button class="tab-btn'+(ui.financeTab===p[0]?' active':'')+'" data-action="finance-tab" data-tab="'+p[0]+'">'+p[1]+'</button>'; }).join('')+'</div>'+
      '<span style="font-size:11.5px;color:var(--text-faint);font-weight:700">'+pendentes.length+' pendente(s) neste mês</span>'+
    '</div>'+
    renderFinanceTable()+
  '</div>';
}

  const tabFiltered = monthItems.filter(f=> ui.financeTab==='todos'? true : ui.financeTab==='entradas'? f.tipo==='entrada' : ui.financeTab==='saidas'? f.tipo==='saida' : f.status==='pendente');

function refreshContractLive(){
  const fieldsBox = $('#contract-form-fields');
  if(fieldsBox && !fieldsBox.dataset.built){
    fieldsBox.innerHTML = contractFormFieldsHtml(contractDraft.seed);
    fieldsBox.dataset.built = '1';
  }
  const data = readContractForm();
  const parcelasCalc = computeParcelas(data);
  parcelasCalc.forEach(function(p,i){
    const span = document.getElementById('parcela-val-'+i);
    if(span) span.textContent = fmtMoney(p.valor);
  });
  const preview = $('#contract-preview-body');
  if(preview) preview.textContent = buildContractText(data);
}

}
async function downloadContractText(){
  const data = readContractForm();
  const texto = buildContractText(data);
  const slug = (data.contratanteNome||'sem-nome').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'contrato';
  const filename = 'contrato-'+slug+'.txt';
  if(!window.claude){ toast('Download disponível apenas dentro do Claude.'); return; }
  try{
    const downloads = await window.claude.use('downloads');
    if(!downloads){ toast('Download não disponível nesta visualização.'); return; }
    await downloads.save({ filename: filename, data: texto });
    toast('Contrato baixado.');
  }catch(err){
    if(!err || err.code!=='declined'){ toast('Não foi possível baixar o contrato agora.'); }
  }
}

/* ---------------- event delegation ---------------- */
function attachDelegatedHandlers(){ /* per-render wiring handled via document-level delegation */ }

function onDocClick(e){
  if(e.target.classList && e.target.classList.contains('modal-overlay')){ closeModal(); return; }
  const btn = e.target.closest && e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if(action==='nav'){ go(btn.dataset.module); }
  else if(action==='close-modal'){ closeModal(); }
  else if(action==='open-task-modal' || action==='edit-task'){ openTaskModal(id||null); }
  else if(action==='delete-task'){ mutate(function(){ STATE.tasks = STATE.tasks.filter(function(t){return t.id!==id;}); }); closeModal(); toast('Demanda removida.'); }
  else if(action==='demanda-folder'){ ui.demandaFolder = btn.dataset.folder; render(); }
  else if(action==='demanda-view'){ ui.demandaView = btn.dataset.view; render(); }
  else if(action==='demanda-range'){ ui.demandaRange = Number(btn.dataset.range); render(); }
  else if(action==='demanda-cal-nav'){ shiftCalMonth(Number(btn.dataset.dir)); render(); }
  else if(action==='toggle-status-filter'){ var s=btn.dataset.status; if(ui.demandaStatusFilter.has(s)) ui.demandaStatusFilter.delete(s); else ui.demandaStatusFilter.add(s); render(); }
  else if(action==='open-finance-modal'){ openFinanceModal(id||null); }
  else if(action==='delete-finance'){ mutate(function(){ STATE.finance = STATE.finance.filter(function(f){return f.id!==id;}); }); closeModal(); toast('Lançamento removido.'); }
  else if(action==='finance-tab'){ ui.financeTab = btn.dataset.tab; render(); }
  else if(action==='finance-month-nav'){ shiftFinanceMonth(Number(btn.dataset.dir)); render(); }
  else if(action==='open-contract-modal'){ openContractModal(id||null); }
  else if(action==='delete-contract'){ mutate(function(){ STATE.contracts = STATE.contracts.filter(function(k){return k.id!==id;}); }); closeModal(); toast('Contrato removido.'); }
  else if(action==='contract-month-nav'){ shiftContractMonth(Number(btn.dataset.dir)); render(); }
  else if(action==='open-client-modal'){ openClientModal(id||null); }
  else if(action==='delete-client'){ mutate(function(){ STATE.clients = STATE.clients.filter(function(c){return c.id!==id;}); STATE.tasks = STATE.tasks.filter(function(t){return t.clientId!==id;}); }); closeModal(); toast('Cliente removido.'); }
  else if(action==='cliente-filter'){ ui.clienteFilter = btn.dataset.filter; render(); }
  else if(action==='toggle-member-status'){ mutate(function(){ var u=userById(id); if(u) u.status = u.status==='ativo'?'revogado':'ativo'; }); }
  else if(action==='toggle-member-module'){ mutate(function(){ var u=userById(id); if(!u||u.role==='admin') return; var mod=btn.dataset.module; var i=u.modules.indexOf(mod); if(i>-1) u.modules.splice(i,1); else u.modules.push(mod); }); }
  else if(action==='toggle-clients-visible'){ if(ui.expandedMembers.has(id)) ui.expandedMembers.delete(id); else ui.expandedMembers.add(id); render(); }
  else if(action==='toggle-client-for-member'){ /* handled on change event for checkboxes */ }
  else if(action==='copy-invite-link'){ copyText(btn.dataset.link); }
  else if(action==='revoke-invite'){ mutate(function(){ STATE.invites = STATE.invites.filter(function(i){return i.id!==id;}); }); }
  else if(action==='contract-toggle-preview'){
    const modal = document.getElementById('contract-modal');
    if(modal){
      modal.classList.toggle('no-preview');
      const hidden = modal.classList.contains('no-preview');
      ui.contractPreviewHidden = hidden;
      btn.innerHTML = svgIcon(hidden?'doc':'x')+' '+(hidden?'Mostrar prévia':'Ocultar prévia');
    }
  }
  else if(action==='contract-download'){ downloadContractText(); }
  else if(action==='contract-parcela-inc' || action==='contract-parcela-dec'){
    document.querySelectorAll('#parcela-rows [data-parcela-idx]').forEach(function(inp){ contractDraft.parcelaDescricoes[Number(inp.dataset.parcelaIdx)] = inp.value; });
    if(action==='contract-parcela-inc') contractDraft.numParcelas = Math.min(12, contractDraft.numParcelas+1);
    else contractDraft.numParcelas = Math.max(1, contractDraft.numParcelas-1);
    rebuildParcelaRows();
    const stepperSpan = document.querySelector('#contract-form-fields .stepper span');
    if(stepperSpan) stepperSpan.textContent = contractDraft.numParcelas+' parcela'+(contractDraft.numParcelas>1?'s':'');
    refreshContractLive();
  }
  else if(action==='toggle-nota-emitida'){ mutate(function(){ const f=STATE.finance.find(function(x){return x.id===id;}); if(f) f.notaEmitida = !f.notaEmitida; }); }
  else if(action==='recurring-mark-paid'){
    const re = STATE.recurringExpenses.find(function(r){return r.id===id;});
    if(re && re.valorPadrao!=null){
      mutate(function(){
        STATE.finance.push({ id:uid('fx'), tipo:'saida', categoria:'Saídas fixas', clientId:null, data: ui.financeMonth+'-'+String(re.diaVencimento).padStart(2,'0'), valor: re.valorPadrao, status:'pago', descricao: re.nome, recurringId: re.id });
      });
      toast(re.nome+' marcado como pago.');
    }
  }
  else if(action==='recurring-define'){
    const re = STATE.recurringExpenses.find(function(r){return r.id===id;});
    if(re) openFinanceModal(null, { categoria:'Saídas fixas', descricao:re.nome, tipo:'saida', data: ui.financeMonth+'-'+String(re.diaVencimento).padStart(2,'0'), recurringId:re.id });
  }
  else if(action==='edit-meta-financeiro'){ openMetaFinanceiroModal(); }
  else if(action==='logout'){ try{ localStorage.removeItem('potencial-os-auth'); }catch(e){} renderLoginScreen(); }
  else if(action==='maquina-tab'){ ui.maquinaTab = btn.dataset.tab; render(); }
  else if(action==='maquina-month-nav'){ shiftMaquinaMonth(Number(btn.dataset.dir)); render(); }
  else if(action==='crm-view'){ ui.crmView = btn.dataset.view; render(); }
  else if(action==='open-lead-modal' || action==='edit-lead'){ openLeadModal(id||null); }
  else if(action==='delete-lead'){ mutate(function(){ STATE.leads = STATE.leads.filter(function(l){return l.id!==id;}); }); closeModal(); toast('Lead removido.'); }
  else if(action==='open-daily-marketing-modal'){ openDailyMarketingModal(); }
  else if(action==='edit-growth-meta'){ openGrowthMetaModal(); }
  else if(action==='open-proposta-modal' || action==='edit-proposta'){ openPropostaModal(id||null); }
  else if(action==='delete-proposta'){ mutate(function(){ STATE.proposals = STATE.proposals.filter(function(p){return p.id!==id;}); }); closeModal(); toast('Proposta removida.'); }
  else if(action==='proposta-toggle-preview'){
    const modal = document.getElementById('proposta-modal');
    if(modal){
      modal.classList.toggle('proposta-no-preview');
      const hidden = modal.classList.contains('proposta-no-preview');
      btn.innerHTML = svgIcon(hidden?'doc':'x')+' '+(hidden?'Mostrar prévia':'Ocultar prévia');
    }
  }
  else if(action==='proposta-export-pdf'){ printProposta(); }
}

function onDocChange(e){
  const t = e.target;
  if(!t.matches) return;
  if(t.matches('[data-action="change-member-role"]')){
    mutate(function(){
      const u=userById(t.dataset.id); if(!u) return;
      if(t.value==='admin'){ u.role='admin'; u.modules=MODULES.map(function(m){return m.id;}); u.clientesVisiveis='all'; }
      else { u.role='membro'; if(u.modules.length===MODULES.length) u.modules=['dashboard','demandas']; if(u.clientesVisiveis==='all') u.clientesVisiveis=[]; }
    });
  } else if(t.matches('[data-action="toggle-client-for-member"]')){
    mutate(function(){
      const u=userById(t.dataset.member); if(!u) return;
      if(u.clientesVisiveis==='all') u.clientesVisiveis = STATE.clients.map(function(c){return c.id;});
      const cid=t.dataset.client; const arr=u.clientesVisiveis; const i=arr.indexOf(cid);
      if(i>-1) arr.splice(i,1); else arr.push(cid);
    });
  } else if(t.matches('[data-action-change="contract-modelo"]')){
    contractDraft.modelo = t.value;
    const form = t.form;
    if(form){
      if(form.elements['servicos']) form.elements['servicos'].value = MODELOS_CONTRATO[t.value].servicos;
      if(form.elements['prazo']) form.elements['prazo'].value = MODELOS_CONTRATO[t.value].prazo;
    }
    refreshContractLive();
  } else if(t.matches('[data-action-change="contract-cliente"]')){
    contractDraft.clientId = t.value;
    const cl = clientById(t.value);
    const form = t.form;
    if(cl && form && form.elements['contratanteNome'] && !form.elements['contratanteNome'].value){ form.elements['contratanteNome'].value = cl.nome; }
    refreshContractLive();
  } else if(t.matches('[data-action-change="contratada-field"]')){
    const field = t.dataset.field;
    mutate(function(){ STATE.meta.contratada[field] = t.value; });
    refreshContractLive();
  } else if(t.matches('[name="tipoDoc"], [name="formaPagamento"], [name="status"]') && t.form && t.form.dataset.form==='contract'){
    refreshContractLive();
  } else if(t.matches('[data-action-change="crm-filter-select"]')){
    ui.crmFilters[t.dataset.filterKey] = t.value;
    render();
  } else if(t.matches('[data-action-change="proposta-cliente"]')){
    propostaDraft.clientId = t.value;
    const cl = clientById(t.value);
    const form = t.form;
    if(cl && form){
      if(form.elements['nomeCliente']) form.elements['nomeCliente'].value = cl.nome;
      if(form.elements['segmento']) form.elements['segmento'].value = cl.segmento||'';
    }
    refreshPropostaLive();
  } else if(t.matches('[data-action-change="proposta-modelo"]')){
    propostaDraft.modelo = t.value;
    refreshPropostaLive();
  }
}

function onDocSubmit(e){
  const form = e.target;
  if(!form.dataset || !form.dataset.form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const type = form.dataset.form;
  if(type==='task'){
    const id = form.dataset.id;
    const data = { titulo: fd.get('titulo').trim(), clientId: fd.get('clientId'), responsavelId: fd.get('responsavelId'), data: fd.get('data'), prioridade: fd.get('prioridade'), status: fd.get('status') };
    mutate(function(){
      if(id){ Object.assign(STATE.tasks.find(function(t){return t.id===id;}), data); }
      else { STATE.tasks.push(Object.assign({id:uid('t')}, data)); }
    });
    closeModal(); toast(id?'Demanda atualizada.':'Demanda criada.');
  } else if(type==='contract'){
    const id = form.dataset.id;
    const data = readContractForm();
    const parcelas = computeParcelas(data);
    const texto = buildContractText(data);
    const record = Object.assign({}, data, {
      parcelas: parcelas,
      titulo: data.contratanteNome || (clientById(data.clientId)? clientById(data.clientId).nome : 'Contrato sem nome'),
      tipoServico: MODELOS_CONTRATO[data.modelo].label,
      valor: data.valorTotal,
      texto: texto
    });
    delete record.parcelaDescricoes;
    mutate(function(){
      if(id){ Object.assign(STATE.contracts.find(function(k){return k.id===id;}), record); }
      else { STATE.contracts.push(Object.assign({id:uid('k'), criadoEm: TODAY}, record)); }
    });
    closeModal(); toast(id?'Contrato atualizado e salvo.':'Contrato gerado e salvo no mês.');
  } else if(type==='finance'){
    const id = form.dataset.id;
    const recurringId = fd.get('recurringId')||null;
    const data = { tipo: fd.get('tipo'), categoria: fd.get('categoria').trim(), clientId: fd.get('clientId')||null, data: fd.get('data'), valor: Number(fd.get('valor')), status: fd.get('status'), descricao: fd.get('descricao').trim(), notaEmitida:false, recurringId: recurringId };
    mutate(function(){
      if(id){ Object.assign(STATE.finance.find(function(f){return f.id===id;}), data); }
      else { STATE.finance.push(Object.assign({id:uid('f')}, data)); }
    });
    closeModal(); toast(id?'Lançamento atualizado.':'Lançamento criado.');
  } else if(type==='meta-financeiro'){
    mutate(function(){
      STATE.meta.metaMensal = Number(fd.get('metaMensal'))||STATE.meta.metaMensal;
      STATE.meta.saldoBase = Number(fd.get('saldoBase'))||0;
    });
    closeModal(); toast('Configurações do financeiro atualizadas.');
  } else if(type==='client'){
    const id = form.dataset.id;
    const equipe = fd.getAll('equipe');
    const servicos = fd.get('servicos').split(',').map(function(s){return s.trim();}).filter(Boolean);
    const data = { nome: fd.get('nome').trim(), segmento: fd.get('segmento').trim(), tipo: fd.get('tipo'), situacao: fd.get('situacao'), entrouEm: fd.get('entrouEm'), equipe: equipe, servicos: servicos };
    mutate(function(){
      if(id){ Object.assign(STATE.clients.find(function(c){return c.id===id;}), data); }
      else { STATE.clients.push(Object.assign({id:uid('c'), entregasFeitas:0, entregasTotal:0, temContrato:false}, data)); }
    });
    closeModal(); toast(id?'Cliente atualizado.':'Cliente adicionado.');
  } else if(type==='invite'){
    const email = fd.get('email').trim();
    const role = fd.get('role');
    const validade = fd.get('validade');
    mutate(function(){
      STATE.invites.push({ id: uid('inv'), email: email, role: role, validade: validade, link:'https://potencialmidia.os/convite/'+Math.random().toString(36).slice(2,10), criadoEm: TODAY });
    });
    form.reset();
    toast('Link de convite gerado.');
  } else if(type==='login'){
    const user = (fd.get('username')||'').trim();
    const pass = fd.get('password')||'';
    sha256Hex(pass).then(function(hash){
      if(STATE.auth && user.toLowerCase()===STATE.auth.username.toLowerCase() && hash===STATE.auth.passwordHash){
        try{ localStorage.setItem('potencial-os-auth','unlocked'); }catch(e){}
        bootApp();
      } else {
        renderLoginScreen('Usuário ou senha incorretos.');
      }
    });
  } else if(type==='lead'){
    const id = form.dataset.id;
    const data = { nome: fd.get('nome').trim(), whatsapp: fd.get('whatsapp').trim(), email: fd.get('email').trim(), instagram: fd.get('instagram').trim(), nicho: fd.get('nicho'), tipoServico: fd.get('tipoServico'), origem: fd.get('origem'), valorEstimado: Number(fd.get('valorEstimado'))||0, notas: fd.get('notas').trim(), etapa: fd.get('etapa') };
    mutate(function(){
      if(id){ Object.assign(STATE.leads.find(function(l){return l.id===id;}), data); }
      else { STATE.leads.push(Object.assign({id:uid('l'), criadoEm: TODAY}, data)); }
    });
    closeModal(); toast(id?'Lead atualizado.':'Lead adicionado.');
  } else if(type==='daily-marketing'){
    mutate(function(){
      STATE.dailyMarketing.push({ id:uid('dm'), data: fd.get('data'), investimento: Number(fd.get('investimento'))||0, leadsGerados: Number(fd.get('leadsGerados'))||0 });
    });
    closeModal(); toast('Dados do dia lançados.');
  } else if(type==='growth-meta'){
    mutate(function(){
      STATE.growthMeta = {
        investimento: Number(fd.get('investimento'))||0, leads: Number(fd.get('leads'))||0,
        roas: Number(fd.get('roas'))||0, cpa: Number(fd.get('cpa'))||0,
        agendamento: Number(fd.get('agendamento'))||0, taxaAgendamento: Number(fd.get('taxaAgendamento'))||0,
        showUp: Number(fd.get('showUp'))||0, conversao: Number(fd.get('conversao'))||0
      };
    });
    closeModal(); toast('Metas atualizadas.');
  } else if(type==='proposta'){
    const id = form.dataset.id;
    const data = readPropostaForm();
    mutate(function(){
      if(id){ Object.assign(STATE.proposals.find(function(p){return p.id===id;}), data); }
      else { STATE.proposals.push(Object.assign({id:uid('p'), criadoEm: TODAY}, data)); }
    });
    closeModal(); toast(id?'Proposta atualizada.':'Proposta criada.');
  }
}

function gaugeHtml(pct, colorVar, size){
  size = size||96;
  const r=(size-14)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,Math.max(0,pct))/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="9"/>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+colorVar+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
  '</svg>';
}
function gaugeItem(pct, label, size){
  size = size||96;
  const color = pct>=100?'var(--green)':(pct>=50?'var(--teal)':'var(--amber)');
  return '<div class="gauge-item"><div style="position:relative;width:'+size+'px;height:'+size+'px">'+
    '<div style="position:absolute;inset:0">'+gaugeHtml(pct,color,size)+'</div>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:\'Sora\';font-weight:800;font-size:16px">'+Math.round(pct)+'%</div>'+
  '</div><div class="g-label">'+label+'</div></div>';
}
function multiDonut(segments, size){
  size = size||140;
  const r=(size-16)/2, c=2*Math.PI*r;
  const total = segments.reduce(function(a,s){return a+s.value;},0) || 1;
  let acc = 0;
  const circles = segments.filter(function(s){return s.value>0;}).map(function(s){
    const dash = s.value/total*c;
    const circle = '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="14" stroke-dasharray="'+dash.toFixed(1)+' '+(c-dash).toFixed(1)+'" stroke-dashoffset="'+(-acc).toFixed(1)+'"/>';
    acc += dash;
    return circle;
  }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="14"/>'+circles+'</svg>';
}
function mvrBlock(metaVal, realVal, label){
  return '<div class="mvr-numbers"><div class="mvr-col"><span class="lbl">Meta</span><b style="color:var(--amber)">'+metaVal+'</b></div><div class="mvr-sep">:</div><div class="mvr-col"><span class="lbl">Realizado</span><b style="color:var(--green)">'+realVal+'</b></div></div>'+
    '<p style="text-align:center;font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:-10px 0 6px">'+label+'</p>';
}
function metricRow(metaVal, label, desc, realVal, pct){

    '<div class="m-mid"><div class="m-label">'+label+'</div><div class="m-desc">'+desc+'</div><div class="progress"><span style="width:'+Math.min(100,Math.max(0,pct))+'%"></span></div></div>'+

}

function renderMaquinaMarketing(root){
  const g = STATE.growthMeta;
  const dm = STATE.dailyMarketing.filter(function(d){ return d.data.slice(0,7)===ui.maquinaMonth; });
  const investReal = dm.reduce(function(a,b){return a+b.investimento;},0);
  const leadsReal = dm.reduce(function(a,b){return a+b.leadsGerados;},0);
  const cplReal = leadsReal>0 ? investReal/leadsReal : 0;
  const cplMeta = g.leads>0 ? g.investimento/g.leads : 0;
  const contratosMes = STATE.contracts.filter(function(k){ return k.mes===ui.maquinaMonth && k.status==='assinado'; });
  const faturamentoComercial = contratosMes.reduce(function(a,b){return a+b.valor;},0);
  const roasReal = investReal>0 ? faturamentoComercial/investReal : 0;
  const cpaReal = contratosMes.length>0 ? investReal/contratosMes.length : 0;
  const roasPct = g.roas>0 ? (roasReal/g.roas*100) : 0;
  const cplPct = (cplReal>0 && cplMeta>0) ? (cplMeta/cplReal*100) : (leadsReal>0?100:0);
  const leadsPct = g.leads>0 ? (leadsReal/g.leads*100) : 0;

  root.innerHTML = maquinaTabsHtml()+maquinaMonthNav()+
  '<div class="card mvr-card">'+
    '<div class="mvr-head"><div style="display:flex;align-items:center;gap:10px"><span class="mvr-icon">MT</span><div><h2>Performance de Campanhas</h2><p>Meta vs Realizado</p></div></div></div>'+
    mvrBlock(g.leads, leadsReal, 'Leads')+
    '<div class="gauge-row">'+gaugeItem(roasPct,'ROAS atingido')+gaugeItem(cplPct,'Eficiência CPL')+gaugeItem(leadsPct,'Leads atingido')+'</div>'+
    metricRow(fmtMoney(g.investimento),'Investimento','Soma do investimento lançado no mês', fmtMoney(investReal), g.investimento>0?investReal/g.investimento*100:0)+
    metricRow(g.leads,'Leads','Soma dos leads lançados no mês', leadsReal, leadsPct)+
    metricRow(fmtMoney(cplMeta),'CPL','Investimento ÷ Leads', fmtMoney(cplReal), cplPct)+
    metricRow(g.roas+'x','ROAS','Faturamento contratado (comercial) ÷ Investimento', roasReal.toFixed(1)+'x', roasPct)+
    metricRow(fmtMoney(g.cpa),'CPA','Investimento ÷ Vendas fechadas (comercial)', fmtMoney(cpaReal), cpaReal>0&&g.cpa>0?(g.cpa/cpaReal*100):0)+
  '</div>';
}
function renderMaquinaComercial(root){
  const g = STATE.growthMeta;
  const dm = STATE.dailyMarketing.filter(function(d){ return d.data.slice(0,7)===ui.maquinaMonth; });
  const leadsReal = dm.reduce(function(a,b){return a+b.leadsGerados;},0);

  const fechadosReal = STATE.leads.filter(function(l){ return l.etapa==='fechado'; }).length;
  const taxaAgendReal = leadsReal>0 ? (agendamentoReal/leadsReal*100) : 0;
  const showUpReal = agendamentoReal>0 ? (reuniaoReal/agendamentoReal*100) : 0;
  const conversaoReal = reuniaoReal>0 ? (fechadosReal/reuniaoReal*100) : 0;

    metricRow(g.taxaAgendamento+'%','Taxa de agendamento','Agendamentos ÷ Leads do marketing', Math.round(taxaAgendReal)+'%', taxaPct)+
    metricRow(g.showUp+'%','Show-up rate','Reuniões realizadas ÷ Agendamentos', Math.round(showUpReal)+'%', showUpPct)+
    metricRow(0,'Reunião realizada','Contagem atual de leads que compareceram', reuniaoReal, 0)+

    '</div><div class="modal-foot">'+
      '<button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button>'+
      '<button type="submit" class="btn btn-primary">Salvar metas</button>'+
    '</div></form>'+
  '</div></div>';
  openModal(html);
}

/* ---------------- propostas ---------------- */
function renderPropostas(root){
  const list = STATE.proposals.slice().sort(function(a,b){ return b.criadoEm<a.criadoEm?-1:1; });
  root.innerHTML = '<div class="card">'+
    (list.length ? list.map(function(p){
      const modelo = MODELOS_CONTRATO[p.modelo]||MODELOS_CONTRATO.social;
      return '<div class="proposta-card">'+
        '<span class="icon-badge">'+svgIcon('propostas')+'</span>'+
        '<div style="flex:1;min-width:0"><b style="font-size:13.5px;text-transform:uppercase;letter-spacing:.01em">'+esc(p.nomeCliente)+'</b>'+
        '<div style="font-size:11.5px;color:var(--text-faint);font-weight:600;margin-top:2px">'+esc(modelo.label)+' · '+fmtMoney(p.setup||0)+' + '+fmtMoney(p.mensal||0)+'/mês</div></div>'+
        pill(STATUS_PROPOSTA,p.status)+
        '<div style="display:flex;gap:4px">'+
          '<button class="btn btn-ghost btn-icon btn-sm" data-action="open-proposta-modal" data-id="'+p.id+'">'+svgIcon('edit')+'</button>'+
          '<button class="btn btn-ghost btn-icon btn-sm" data-action="delete-proposta" data-id="'+p.id+'">'+svgIcon('trash')+'</button>'+
        '</div>'+
      '</div>';
    }).join('') : '<div class="empty-state">'+svgIcon('propostas')+'<p>Nenhuma proposta criada ainda.</p></div>')+
  '</div>';
}
function openPropostaModal(id){
  const p = id ? STATE.proposals.find(function(x){return x.id===id;}) : null;
  propostaDraft = { id: p?p.id:null, modelo: p?p.modelo:'social', clientId: p?(p.clientId||''):'', seed: p||{} };
  openModal(propostaModalShell(p));
  refreshPropostaLive();
  const first = $('#modal-root input[name="nomeCliente"]'); if(first) first.focus();
}
function propostaModalShell(p){
  const isEdit = !!p;
  return '<div class="modal-overlay"><div class="modal xwide" id="proposta-modal">'+
    '<div class="modal-head"><h3>'+(isEdit?'Editar proposta':'Nova proposta')+'</h3>'+
      '<div style="display:flex;align-items:center;gap:8px">'+
        '<button type="button" class="btn btn-ghost btn-sm" data-action="proposta-toggle-preview">'+svgIcon('x')+' Ocultar prévia</button>'+
        '<button class="close-x" data-action="close-modal">'+svgIcon('x')+'</button>'+
      '</div>'+
    '</div>'+
    '<form data-form="proposta" data-id="'+(p?p.id:'')+'">'+
      '<div class="proposta-modal-body">'+
        '<div class="proposta-form-col" id="proposta-form-fields"></div>'+
        '<div class="proposta-preview-col" id="proposta-preview-body"></div>'+
      '</div>'+
      '<div class="modal-foot">'+
        (isEdit?'<button type="button" class="btn btn-danger" data-action="delete-proposta" data-id="'+p.id+'" style="margin-right:auto">'+svgIcon('trash')+' Excluir</button>':'')+
        '<button type="button" class="btn btn-ghost" data-action="proposta-export-pdf">'+svgIcon('download')+' Exportar PDF</button>'+
        '<button type="submit" class="btn btn-primary">'+svgIcon('check')+' Salvar proposta</button>'+
      '</div>'+
    '</form>'+
  '</div></div>';
}
function propostaFormFieldsHtml(d){
  const clients = STATE.clients;
  return ''+
  '<div class="section-label">Dados do cliente</div>'+
  '<div><label>Cliente existente (autofill)</label><select name="clientIdSel" data-action-change="proposta-cliente"><option value="">Em branco / sem cliente</option>'+clients.map(function(c){ return '<option value="'+c.id+'"'+(propostaDraft.clientId===c.id?' selected':'')+'>'+esc(c.nome)+'</option>'; }).join('')+'</select></div>'+
  '<div><label>Nome do cliente</label><input name="nomeCliente" required value="'+(d.nomeCliente?esc(d.nomeCliente):'')+'" placeholder="Ex: Studio Corpo Ativo"></div>'+
  '<div><label>Segmento / nicho</label><input name="segmento" value="'+(d.segmento?esc(d.segmento):'')+'" placeholder="Ex: Academia"></div>'+
  '<div class="section-label">Serviço</div>'+
  '<div><label>Modelo de serviço</label><select name="modelo" data-action-change="proposta-modelo">'+Object.keys(MODELOS_CONTRATO).map(function(mk){ return '<option value="'+mk+'"'+(propostaDraft.modelo===mk?' selected':'')+'>'+MODELOS_CONTRATO[mk].label+'</option>'; }).join('')+'</select></div>'+
  '<div class="section-label">Valores</div>'+
  '<div class="form-row cols-2"><div><label>Setup / entrada (R$)</label><input type="number" step="0.01" min="0" name="setup" value="'+(d.setup!=null?d.setup:'')+'"></div><div><label>Mensal (R$)</label><input type="number" step="0.01" min="0" name="mensal" value="'+(d.mensal!=null?d.mensal:'')+'"></div></div>'+
  '<div class="form-row cols-2"><div><label>Taxa de performance (%) — opcional</label><input type="number" step="0.1" min="0" name="performancePct" value="'+(d.performancePct!=null?d.performancePct:'')+'"></div><div><label>Validade da proposta</label><input name="validade" value="'+(d.validade?esc(d.validade):'')+'" placeholder="Ex: Outubro de 2026"></div></div>'+
  '<div class="section-label">Observação opcional</div>'+
  '<div><label>Texto de investimento personalizado</label><textarea name="observacao" rows="4" placeholder="Deixe em branco para usar o padrão...">'+(d.observacao?esc(d.observacao):'')+'</textarea></div>'+
  '<div><label>Status</label><select name="status">'+Object.keys(STATUS_PROPOSTA).map(function(s){ return '<option value="'+s+'"'+((d.status||'rascunho')===s?' selected':'')+'>'+STATUS_PROPOSTA[s].label+'</option>'; }).join('')+'</select></div>';
}
function readPropostaForm(){
  const form = $('form[data-form="proposta"]'); if(!form) return { modelo:'social' };
  const fd = new FormData(form);
  return {
    clientId: propostaDraft.clientId||'', nomeCliente: fd.get('nomeCliente')||'', segmento: fd.get('segmento')||'',
    modelo: propostaDraft.modelo, setup: Number(fd.get('setup'))||0, mensal: Number(fd.get('mensal'))||0,
    performancePct: fd.get('performancePct') ? Number(fd.get('performancePct')) : null,
    validade: fd.get('validade')||'', observacao: fd.get('observacao')||'', status: fd.get('status')||'rascunho'
  };
}
function buildPropostaPreviewHtml(d){
  const modelo = MODELOS_CONTRATO[d.modelo] || MODELOS_CONTRATO.social;
  const equipe = EQUIPE_POR_MODELO[d.modelo] || EQUIPE_POR_MODELO.social;
  const nome = d.nomeCliente ? esc(d.nomeCliente) : '[Nome do cliente]';
  const invest = d.observacao ? esc(d.observacao) : ('Oferecemos um projeto sob medida para impulsionar a '+nome+' no cenário digital, potencializando os resultados através de estratégias eficazes de marketing, comunicação e gestão contínua.');
  return '<div class="prop-doc" id="proposta-print-target">'+
    '<div class="prop-brand"><div class="mark"></div><b>POTENCIAL <span>MÍDIA</span></b></div>'+
    '<div class="prop-hero">'+
      '<div><h1>PROPOSTA<span class="dot">.</span></h1>'+
      '<p>Em parceria com <b>'+nome+'</b>, nosso objetivo é fortalecer a presença digital da marca e gerar resultados consistentes através de '+modelo.label.toLowerCase()+'.</p>'+
      '<p>'+esc(modelo.servicos)+'</p></div>'+
      '<div class="prop-phases">'+PROPOSTA_FASES.map(function(f){ return '<div class="prop-phase"><b>'+f.titulo+'</b><p>'+f.desc+'</p></div>'; }).join('')+'</div>'+
    '</div>'+
    '<div class="prop-for"><span class="lbl">Proposta para</span><b>'+nome+'</b></div>'+
    '<div class="prop-section-label">O que está incluído <span>· Escopo completo do projeto</span></div>'+
    '<div class="prop-grid">'+
      '<div><h4>Equipe</h4><div class="big">'+equipe.length+'× profissionais dedicados</div><ul class="prop-team-list">'+equipe.map(function(e){ return '<li>'+e+'</li>'; }).join('')+'</ul></div>'+
      '<div><h4>Acompanhamento</h4><div class="big">Suporte direto com a equipe</div><p>Da produção ao relatório de performance, cuidamos de cada etapa com comunicação direta e transparente com você.</p></div>'+
    '</div>'+
    '<div class="prop-service-row"><span class="stag">Serviço principal</span><div style="flex:1"><b>'+esc(modelo.label)+'</b><p>'+esc(modelo.servicos)+'</p></div>'+(d.performancePct?'<span class="perf-pill">'+d.performancePct+'% do resultado</span>':'')+'</div>'+
    (d.mensal>0 ? '<div class="prop-service-row"><span class="stag">Serviço recorrente</span><div style="flex:1"><b>Acompanhamento mensal</b><p>Gestão contínua, relatórios de performance e otimizações mês a mês.</p></div></div>' : '')+
    '<div class="prop-section-label">Investimento</div>'+
    '<div class="prop-invest">'+invest+'</div>'+
    '<div class="prop-footer">'+
      '<div class="valid">Proposta válida até <b>'+(d.validade?esc(d.validade):'[data]')+'</b></div>'+
      '<div class="prop-total"><span class="lbl">Total do investimento</span><div class="nums">'+fmtMoney(d.setup||0)+'<span class="amp">&amp;</span>'+fmtMoney(d.mensal||0)+'</div></div>'+
    '</div>'+
  '</div>';
}
function refreshPropostaLive(){
  const fieldsBox = $('#proposta-form-fields');
  if(fieldsBox && !fieldsBox.dataset.built){
    fieldsBox.innerHTML = propostaFormFieldsHtml(propostaDraft.seed);
    fieldsBox.dataset.built = '1';
  }
  const data = readPropostaForm();
  const preview = $('#proposta-preview-body');
  if(preview) preview.innerHTML = buildPropostaPreviewHtml(data);
}
function printProposta(){
  document.body.classList.add('printing-proposta');
  window.print();
}

/* boot */
(function boot(){
  document.addEventListener('click', onDocClick);
  document.addEventListener('submit', onDocSubmit);
  document.addEventListener('change', onDocChange);
  document.addEventListener('input', onDocInput);
  window.addEventListener('afterprint', function(){ document.body.classList.remove('printing-proposta'); });
  let draggingCard = null;
  document.addEventListener('dragstart', function(e){
    const card = e.target.closest && e.target.closest('.kanban-card, .lead-card');
    if(!card) return;
    draggingCard = card;
    e.dataTransfer.setData('text/plain', card.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover', function(e){
    const col = e.target.closest && e.target.closest('.kanban-col');
    if(!col) return;
    e.preventDefault();
    col.classList.add('drag-over');
  });
  document.addEventListener('dragleave', function(e){
    const col = e.target.closest && e.target.closest('.kanban-col');
    if(col) col.classList.remove('drag-over');
  });
  document.addEventListener('drop', function(e){
    const col = e.target.closest && e.target.closest('.kanban-col');
    if(!col || !draggingCard){ draggingCard=null; return; }
    e.preventDefault();
    col.classList.remove('drag-over');
    const id = draggingCard.dataset.id;
    const kind = draggingCard.dataset.kind || 'task';
    draggingCard = null;
    if(kind==='lead' && col.dataset.etapa){
      const newEtapa = col.dataset.etapa;
      mutate(function(){ const l = STATE.leads.find(function(x){return x.id===id;}); if(l) l.etapa = newEtapa; });
    } else if(kind==='task' && col.dataset.status){
      const newStatus = col.dataset.status;
      mutate(function(){ const t = STATE.tasks.find(function(x){return x.id===id;}); if(t) t.status = newStatus; });
    }
  });
  if(isUnlocked()) render(); else renderLoginScreen();
})();
</script>
